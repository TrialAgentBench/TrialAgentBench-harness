[project]
name = "trial-agent-bench"
version = "0.1.0"
description = "TrialAgentBench: harnesses for clinical-trial agent benchmarks (TrialEvalBench trial-analysis tier and TrialDevBench sequential asset-development tier)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "CC-BY-NC-4.0"
license-files = ["LICENSE"]
authors = [{ name = "Anonymous Authors" }]
dependencies = [
    "numpy>=2.0,<2.4",
    "pandas>=2.2,<3",
    "pydantic>=2.12,<3",
    "pyarrow>=18,<24",
    "scipy>=1.14,<2",
    "statsmodels>=0.14,<0.15",
]

[project.urls]
Homepage = "https://github.com/TrialAgentBench/TrialAgentBench-harness"
Repository = "https://github.com/TrialAgentBench/TrialAgentBench-harness"
Data = "https://huggingface.co/datasets/TrialAgentBench/TrialAgentBench/"
Documentation = "https://github.com/TrialAgentBench/TrialAgentBench-harness/tree/main/harness/docs"
Issues = "https://github.com/TrialAgentBench/TrialAgentBench-harness/issues"

[project.scripts]
trialagentbench = "trialagentbench_harness.cli:main"

[project.optional-dependencies]
providers = [
  "openai>=2.31.0",
  "python-dotenv>=1.2.2",
]
analysis = [
  "lifelines==0.30.0",
  "matplotlib==3.10.8",
  "plotnine==0.15.7; sys_platform != 'emscripten'",
]
dev = [
  "build>=1.2.0",
  "black==26.3.1",
  "jsonschema==4.26.0",
  "lifelines==0.30.0",
  "matplotlib==3.10.8",
  "mypy>=1.10.0",
  "plotnine==0.15.7; sys_platform != 'emscripten'",
  "pytest>=8.0.0",
  "ruff>=0.6.0",
  "python-dotenv>=1.2.2",
  "openai>=2.31.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trialagentbench_harness"]

[tool.hatch.build.targets.wheel.force-include]
"agent_output_schema.json" = "trialagentbench_harness/resources/agent_output_schema.json"
"eval_spec.json" = "trialagentbench_harness/resources/eval_spec.json"
"examples/submissions" = "trialagentbench_harness/resources/examples/submissions"

[tool.hatch.build.targets.sdist]
exclude = [
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/results",
  "/cache",
  "/logs",
]

[tool.uv]
environments = ["sys_platform != 'emscripten'"]

[tool.ruff]
target-version = "py311"
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",
  "UP042",
  "UP047",
]

[tool.black]
line-length = 119
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-q", "-p", "no:cacheprovider", "-m", "not executor"]
markers = [
  "executor: real-container qualification for isolated model-code execution",
  "performance: benchmark-harness performance smoke tests",
]
