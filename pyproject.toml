[project]
name = "trial-agent-bench"
version = "1.0.1"
description = "TrialAgentBench: harnesses for clinical-trial agent benchmarks (TrialEval trial analysis and TrialDev treatment-development decisions)"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "Bradley Segal" }]
dependencies = [
  "clinical-data-tables==1.0.1",
    "jsonschema>=4.26,<5",
    "numpy>=2.0,<2.4",
    "pandas>=2.2,<3",
    "pydantic>=2.12,<3",
    "pyarrow>=18,<24",
    "trialagentbench-verifier==1.0.1",
]

[project.urls]
Homepage = "https://github.com/TrialAgentBench/TrialAgentBench-harness"
Repository = "https://github.com/TrialAgentBench/TrialAgentBench-harness"
Data = "https://huggingface.co/datasets/TrialAgentBench/TrialAgentBench/"
Documentation = "https://github.com/TrialAgentBench/TrialAgentBench-harness/tree/main/docs"
Issues = "https://github.com/TrialAgentBench/TrialAgentBench-harness/issues"

[project.scripts]
trialagentbench = "trialagentbench.cli:main"

[project.optional-dependencies]
providers = [
  "openai>=3.6,<4",
  "httpx2>=2.7,<3",
  "openai-agents>=0.22,<0.23",
  "python-dotenv>=1.2.2",
]
analysis = [
  "matplotlib==3.10.8",
  "plotnine==0.15.7; sys_platform != 'emscripten'",
]
dev = [
  "build>=1.2.0",
  "black==26.3.1",
  "httpx>=0.28,<1",
  "matplotlib==3.10.8",
  "mypy>=1.10.0",
  "plotnine==0.15.7; sys_platform != 'emscripten'",
  "pytest>=9.0.3,<10",
  "ruff>=0.6.0",
  "python-dotenv>=1.2.2",
  "openai>=3.6,<4",
  "httpx2>=2.7,<3",
  "openai-agents>=0.22,<0.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trialagentbench"]

[tool.hatch.build.targets.wheel.force-include]
"examples" = "trialagentbench/resources/examples"

[tool.hatch.build.targets.sdist]
include = [
  "/.env.example",
  "/CITATION.cff",
  "/LICENSE",
  "/Makefile",
  "/README.md",
  "/docs",
  "/examples",
  "/executor",
  "/pyproject.toml",
  "/tests",
  "/trialagentbench",
]
exclude = [
  "/.venv",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/dist",
  "**/__pycache__",
  "/results",
  "/cache",
  "/logs",
]

[tool.hatch.build.targets.sdist.force-include]
"examples/clinical/demo-trialeval-evaluator.zip" = "examples/clinical/demo-trialeval-evaluator.zip"
"examples/clinical/demo-trialdev-evaluator.zip" = "examples/clinical/demo-trialdev-evaluator.zip"

[tool.uv.workspace]
members = ["verifier", "clinical-data"]

[tool.uv.sources]
trialagentbench-verifier = { workspace = true }
clinical-data-tables = { workspace = true }

[tool.uv]
# The qualified host versions of the source repository's lock.
constraint-dependencies = [
  "annotated-types==0.7.0",
  "anyio==4.14.2",
  "attrs==26.1.0",
  "autograd==1.9.1",
  "autograd-gamma==0.5.0",
  "black==26.3.1",
  "build==1.5.0",
  "certifi==2026.1.4",
  "cffi==2.1.1",
  "charset-normalizer==3.4.4",
  "click==8.5.0",
  "colorama==0.4.6",
  "contourpy==1.3.3",
  "cryptography==50.0.1",
  "cycler==0.12.1",
  "fonttools==4.63.0",
  "formulaic==1.2.2",
  "griffelib==2.2.0",
  "h11==0.16.0",
  "hatchling==1.32.0",
  "httpcore==1.0.9",
  "httpcore2==2.12.0",
  "httpx==0.28.1",
  "httpx2==2.12.0",
  "idna==3.19",
  "iniconfig==2.3.0",
  "interface-meta==2.0.1",
  "jiter==0.16.0",
  "jsonschema==4.26.0",
  "jsonschema-specifications==2025.9.1",
  "kiwisolver==1.5.0",
  "librt==0.8.1",
  "lifelines==0.30.3",
  "matplotlib==3.10.8",
  "mcp==2.3.0",
  "mcp-types==2.3.0",
  "mypy==1.19.1",
  "mypy-extensions==1.1.0",
  "narwhals==2.24.0",
  "numpy==2.2.6",
  "numpy-typing-compat==20251206.2.2",
  "openai==3.6.0",
  "openai-agents==0.22.0",
  "opentelemetry-api==1.44.0",
  "optype==0.16.0",
  "packaging==26.0",
  "pandas==2.3.3",
  "pandas-stubs==3.0.5.260730",
  "pathspec==1.0.4",
  "patsy==1.0.2",
  "pillow==12.3.0",
  "pip==26.2.1",
  "platformdirs==4.9.2",
  "pluggy==1.6.0",
  "pyarrow==23.0.1",
  "pycparser==3.0",
  "pydantic==2.12.5",
  "pydantic-core==2.41.5",
  "pygments==2.21.0",
  "pyjwt==2.15.1",
  "pyparsing==3.3.2",
  "pyproject-hooks==1.2.0",
  "pytest==9.1.1",
  "python-dateutil==2.9.0.post0",
  "python-dotenv==1.2.3",
  "python-multipart==0.0.32",
  "pytokens==0.4.1",
  "pytz==2025.2",
  "pywin32==312",
  "referencing==0.37.0",
  "requests==2.34.2",
  "rpds-py==2026.6.3",
  "ruff==0.14.13",
  "scipy==1.15.3",
  "scipy-stubs==1.17.1.0",
  "six==1.17.0",
  "sniffio==1.3.1",
  "sse-starlette==3.4.8",
  "starlette==1.6.0",
  "statsmodels==0.14.6",
  "tomlkit==0.15.1",
  "trove-classifiers==2026.9.21.13",
  "truststore==0.10.4",
  "typing-extensions==4.15.0",
  "typing-inspection==0.4.2",
  "tzdata==2025.3",
  "urllib3==2.8.0",
  "uvicorn==0.52.4",
  "websockets==16.1.1",
  "wrapt==2.3.0",
]
environments = ["sys_platform != 'emscripten'"]

[tool.ruff]
target-version = "py311"
line-length = 119

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",
  "UP042",
  "UP047",
]

[tool.black]
line-length = 119
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
python_files = ["test_*.py"]
addopts = ["-q", "-p", "no:cacheprovider", "-m", "not executor"]
markers = [
  "executor: real-container qualification for isolated model-code execution",
  "performance: benchmark-harness performance smoke tests",
  "slow: distribution-build and installed-artifact checks",
]
