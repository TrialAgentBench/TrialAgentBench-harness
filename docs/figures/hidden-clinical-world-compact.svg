<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 815" role="img" aria-labelledby="title desc">
<title id="title">How a clinical world becomes an imperfect record</title><desc id="desc">Patient characteristics and randomized treatment generate true tumour response. Separate complete simulations supply the hidden reference. Routine assessment errors depend on treatment and prognosis; central review bypasses those errors for a random thirty percent sample. Among 954 centrally reviewed participants in this study, routine assessment missed 22 responses in the combination arm and falsely recorded 12 responses in the control arm.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#536370"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif;fill:#23323d;font-size:20px}.title{font-weight:700}.small{font-size:18px;fill:#536370}.ref{fill:#79552a}.review{fill:#226879}.error{fill:#92332c}.line{fill:none;stroke:#536370;stroke-width:1.8;marker-end:url(#arrow)}.node{fill:none;stroke:#c8d1d7;stroke-width:1.2}.hidden{fill:#79552a;fill-opacity:.05;stroke:#79552a;stroke-width:1.2}.record{fill:#226879;fill-opacity:.04;stroke:#226879;stroke-width:1.2}</style>
<style>text{font-size:17px}.small{font-size:15px}.title{font-size:18px}</style>
<g id="causes"><rect class="node" x="10" y="10" width="320" height="99" rx="3"/><text class="title" x="25" y="39">Patients and randomized treatment</text><text x="25" y="66">Prognosis, baseline risk and treatment</text><text class="small" x="25" y="93">Patient marginals informed by clinical data</text></g>
<path class="line" d="M175 109V149"/>
<path class="line" d="M330 60H343V365H333"/>
<g id="true-response"><rect class="node" x="10" y="153" width="320" height="78" rx="3"/><text class="title" x="25" y="183">True tumour response at day 168</text><text x="25" y="211">Generated by the causal model</text></g>
<path class="line" d="M80 231V290"/><path class="line" d="M245 231V290"/>
<g id="reference"><rect class="hidden" x="10" y="294" width="149" height="142" rx="3"/><text class="title ref" x="24" y="324">Hidden</text><text class="title ref" x="24" y="347">reference</text><text class="small" x="24" y="378">Complete outcomes</text><text class="small" x="24" y="405">Separate</text><text class="small" x="24" y="425">simulations</text></g>
<g id="routine"><rect class="node" x="183" y="294" width="147" height="142" rx="3"/><text class="title" x="197" y="324">Routine</text><text class="title" x="197" y="347">assessment</text><text class="small" x="197" y="378">Errors depend on</text><text class="small" x="197" y="405">treatment and</text><text class="small" x="197" y="425">prognosis</text></g>
<path class="line" d="M245 436V515"/>
<path class="line" d="M175 231V475H82V515"/><text class="small review" x="16" y="469">30% central review</text>
<g id="records"><rect class="record" x="10" y="519" width="320" height="79" rx="3"/><text class="title review" x="25" y="549">Analyst's records</text><text x="25" y="578">Routine assessments + reviewed labels</text></g>
<g id="observed-errors"><path d="M10 631H340" stroke="#c8d1d7"/><text class="small" x="10" y="659">Among the 954 reviewed participants:</text><text class="title" x="10" y="692">Combination arm: 22 responses</text><text class="error" x="30" y="718">→ recorded as no response</text><text class="title" x="10" y="760">Control arm: 12 non-responses</text><text class="error" x="30" y="786">→ recorded as response</text></g>
</svg>
