<svg xmlns="http://www.w3.org/2000/svg" width="360" height="792" viewBox="0 0 360 792" role="img" aria-labelledby="title desc">
  <title id="title">From clinical world to evidence and assessment</title><desc id="desc">Clinical evidence informs explicit patient, treatment and outcome mechanisms. The evaluator derives a target from that world. Trial conduct and observation produce the records the agent analyses. Further research acquires new evidence. Assessment measures the analysis and research consequences.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10" fill="none" stroke="#536370" stroke-width="1.5"/></marker></defs>
  <style>text{font-family:Arial,'Liberation Sans',sans-serif;fill:#23323d;font-size:16px}.heading{font-size:19px;font-weight:700}.small{font-size:15px;fill:#536370}.edge{fill:none;stroke:#536370;stroke-width:1.6;marker-end:url(#arrow)}</style>
  <text x="14" y="25" class="heading">Clinical evidence informs the world</text><text x="14" y="52">Patient populations and outcomes;</text><text x="14" y="76">recruitment, follow-up and conduct</text><path class="edge" d="M180 89V117"/>
  <rect x="8" y="126" width="344" height="203" rx="6" fill="#edf3f1" stroke="#91aaa1"/><text x="24" y="155" class="heading">The hidden clinical world</text><text x="24" y="190">Patient</text><text x="24" y="213">characteristics</text><text x="218" y="190">Treatment</text><text x="218" y="213" class="small">and exposure</text><path class="edge" d="M88 226V246H164V266"/><path class="edge" d="M274 226V246H195V266"/><text x="65" y="289">Health outcomes and events</text><text x="79" y="316" class="small">Structural causal models</text>
  <path class="edge" d="M88 329V358"/><path class="edge" d="M270 329V469"/>
  <rect x="8" y="366" width="235" height="88" rx="6" fill="#f6f0e6" stroke="#b6a07b"/><text x="24" y="394" class="heading">Evaluator's reference</text><text x="24" y="419">Derive the target for</text><text x="24" y="440">the specified clinical question</text>
  <rect x="74" y="478" width="278" height="111" rx="6" fill="#eef3f8" stroke="#a0b5c4"/><text x="91" y="506" class="heading">Agent's evidence</text><text x="91" y="533">Trial conduct and observation</text><text x="91" y="556">produce patient records</text><text x="91" y="579">and clinical documents.</text>
  <path class="edge" d="M218 589V620"/><text x="79" y="646" class="heading">Analyse, interpret, decide</text><text x="79" y="672" class="small">Further studies acquire new evidence.</text><path class="edge" d="M338 623H357V461H304"/>
  <path class="edge" d="M30 454V716H172"/><path class="edge" d="M218 685V716H191"/><text x="180" y="751" class="heading" text-anchor="middle">Assess the answer</text><text x="180" y="778" class="heading" text-anchor="middle">and the research consequences</text>
</svg>
