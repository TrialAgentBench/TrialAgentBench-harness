<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 510" role="img" aria-labelledby="title desc">
<title id="title">How a clinical world becomes an imperfect record</title><desc id="desc">Patient characteristics and randomized treatment generate true tumour response. Separate complete simulations supply the hidden reference. Routine assessment errors depend on treatment and prognosis; central review bypasses those errors for a random thirty percent sample. Among 954 centrally reviewed participants in this study, routine assessment missed 22 responses in the combination arm and falsely recorded 12 responses in the control arm.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#536370"/></marker></defs><style>text{font-family:Arial,"Liberation Sans",sans-serif;fill:#23323d;font-size:20px}.title{font-weight:700}.small{font-size:18px;fill:#536370}.ref{fill:#79552a}.review{fill:#226879}.error{fill:#92332c}.line{fill:none;stroke:#536370;stroke-width:1.8;marker-end:url(#arrow)}.node{fill:none;stroke:#c8d1d7;stroke-width:1.2}.hidden{fill:#79552a;fill-opacity:.05;stroke:#79552a;stroke-width:1.2}.record{fill:#226879;fill-opacity:.04;stroke:#226879;stroke-width:1.2}</style>
<g id="causes"><rect class="node" x="16" y="22" width="275" height="131" rx="3"/><text class="title" x="34" y="53">Patients and treatment</text><text x="34" y="85">Prognosis and baseline risk</text><text x="34" y="114">Randomized treatment</text><text class="small" x="34" y="139">Selected clinical marginals</text></g>
<path class="line" d="M291 86H347"/>
<g id="true-response"><rect class="node" x="351" y="39" width="249" height="99" rx="3"/><text class="title" x="369" y="70">True tumour response</text><text x="369" y="101">At day 168</text><text class="small" x="369" y="124">Causal model</text></g>
<path class="line" d="M600 88H703"/>
<g id="reference"><rect class="hidden" x="707" y="39" width="237" height="99" rx="3"/><text class="title ref" x="725" y="70">Hidden reference</text><text x="725" y="101">Complete outcomes</text><text class="small" x="725" y="124">Separate simulations</text></g>
<path class="line" d="M401 138V242"/>
<path class="line" d="M526 138V184H827V242"/><text class="small review" x="570" y="174">Random 30% central review</text>
<path class="line" d="M154 153V290H347"/>
<g id="routine"><rect class="node" x="351" y="246" width="249" height="103" rx="3"/><text class="title" x="369" y="278">Routine assessment</text><text class="small" x="369" y="309">Arm and prognosis shape</text><text class="small" x="369" y="335">assessment errors</text></g>
<path class="line" d="M600 294H703"/>
<g id="collected-records"><rect class="record" x="707" y="246" width="237" height="103" rx="3"/><text class="title review" x="725" y="278">Analyst's records</text><text x="725" y="308">Routine assessments</text><text x="725" y="335">+ reviewed true labels</text></g>
<g id="observed-errors"><path d="M16 381H944" stroke="#c8d1d7"/><text class="small" x="16" y="413">Errors visible among the 954 reviewed participants in this study</text><text x="16" y="451"><tspan font-weight="700">Combination arm:</tspan> 22 responses</text><path class="line" d="M363 445H406"/><text class="error" x="425" y="451">recorded as no response</text><text x="16" y="486"><tspan font-weight="700">Control arm:</tspan> 12 non-responses</text><path class="line" d="M363 480H406"/><text class="error" x="425" y="486">recorded as response</text></g>
</svg>
