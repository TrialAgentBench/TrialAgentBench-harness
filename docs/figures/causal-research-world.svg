<svg xmlns="http://www.w3.org/2000/svg" width="960" height="640" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
  <title id="title">One clinical world, two ways of seeing it</title>
  <desc id="desc">Clinical studies inform patient characteristics and trial conduct. Explicit causal mechanisms connect patient characteristics and treatment to outcomes. The evaluator calculates the target under the specified interventions. Recruitment, allocation, follow-up and measurement produce the records seen by an agent. In TrialDev the agent chooses further studies, returning to trial conduct. Assessment compares the analysis with the target and measures the research programme's consequences.</desc>
  <defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="none" stroke="#536370" stroke-width="1.5"/></marker></defs>
  <style>text{font-family:Arial,'Liberation Sans',sans-serif;fill:#23323d;font-size:18px}.heading{font-size:22px;font-weight:700}.small{font-size:16px;fill:#536370}.label{font-size:17px;font-weight:700}.edge{fill:none;stroke:#536370;stroke-width:1.7;marker-end:url(#arrow)}.rule{stroke:#c8d1d7;fill:none}.world{fill:#edf3f1;stroke:#91aaa1}.observed{fill:#eef3f8;stroke:#a0b5c4}.truth{fill:#f6f0e6;stroke:#b6a07b}</style>
  <g id="clinical-inputs"><text x="24" y="30" class="heading">Clinical evidence informs construction</text><text x="24" y="60">Patient populations and outcomes</text><text x="495" y="60">Recruitment, follow-up and study conduct</text><path class="edge" d="M242 76V114"/><path class="edge" d="M710 76V114"/></g>
  <g id="causal-world"><rect class="world" x="16" y="120" width="928" height="166" rx="7"/><text x="40" y="153" class="heading">The hidden clinical world</text><text x="40" y="178" class="small">Structural causal models specify how patients respond under different treatments.</text><text x="50" y="228" class="label">Patient characteristics</text><text x="50" y="256" class="small">Risk, severity, site</text><text x="379" y="228" class="label">Health outcomes</text><text x="379" y="256" class="small">Benefit and harm over time</text><text x="754" y="228" class="label">Treatment</text><text x="754" y="256" class="small">Assignment, exposure</text><path class="edge" d="M270 223H357"/><path class="edge" d="M730 223H634"/></g>
  <path class="edge" d="M242 286V334"/><text x="262" y="316" class="small">Derive the specified target</text><path class="edge" d="M710 286V334"/><text x="730" y="316" class="small">Conduct a trial</text>
  <g id="evaluator-reference"><rect class="truth" x="16" y="341" width="444" height="125" rx="7"/><text x="40" y="376" class="heading">What the evaluator can know</text><text x="40" y="407">The effect for the specified population,</text><text x="40" y="434">outcome and follow-up horizon</text></g>
  <g id="agent-observations"><rect class="observed" x="500" y="341" width="444" height="125" rx="7"/><text x="524" y="376" class="heading">What the agent can observe</text><text x="524" y="407">Recruited patients, assigned treatments,</text><text x="524" y="434">visits, recorded outcomes and documents</text></g>
  <path class="edge" d="M710 466V505"/><text x="500" y="493" class="small">Analyse the available evidence</text>
  <g id="interpretation"><text x="524" y="537" class="heading">Estimate, interpret, choose research</text><text x="524" y="565" class="small">Further studies change what the agent can learn.</text><path class="edge" d="M920 517H954V302H938"/></g>
  <path class="edge" d="M238 466V591H475"/><path class="edge" d="M710 575V591H497"/>
  <g id="assessment"><text x="480" y="620" text-anchor="middle" class="heading">Assess the answer and the consequences of acting on it</text></g>
</svg>
