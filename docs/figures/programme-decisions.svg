<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 660" role="img" aria-labelledby="title description">
<title id="title">What later studies reveal in two arthritis worlds</title>
<desc id="description">Programme A and Programme B use the same study plan in different simulated worlds. Both pilots are uncertain. Exploration favours treatment in A while B remains uncertain. Confirmation favours treatment in A and control in B. Each point is a treatment-minus-control difference with a 95% Welch interval. The three studies have different follow-up horizons.</desc>
<style>text{font-family:Arial,"Liberation Sans",sans-serif;fill:#23323d;font-size:18px}.heading{font-size:24px;font-weight:700}.stage{font-size:21px;font-weight:700}.strong{font-weight:700}.rule{stroke:#c8d1d7;stroke-width:1}.zero{stroke:#78858d;stroke-width:1.2;stroke-dasharray:4 3}.interval{stroke-width:3}.estimate{stroke:white;stroke-width:1.5}</style>
