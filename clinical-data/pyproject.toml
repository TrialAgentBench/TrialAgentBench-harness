[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "clinical-data-tables"
version = "1.0.0"
description = "Shared observed clinical-data projections without a simulation runtime"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = ["numpy>=1.21,<2.4", "pandas>=1.4,<3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/clinical_data_tables"]

[tool.hatch.build.targets.sdist]
include = ["/LICENSE", "/README.md", "/pyproject.toml", "/src", "/tests"]
